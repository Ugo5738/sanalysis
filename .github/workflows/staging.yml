name: SuperSame Analysis Backend CI/CD Pipeline (Staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Upgrade pip and Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Tests
        env:
          # ===========================================================
          # ------------------------- GENERAL -------------------------
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DJANGO_SETTINGS_MODULE: ${{ secrets.DJANGO_SETTINGS_MODULE }}
          DEBUG: ${{ secrets.DEBUG }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          SITE_ID: ${{ secrets.SITE_ID }}

          # ------------------------- SUPERUSER -------------------------
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

          # ------------------------- DATABASE -------------------------
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_SSLMODE: ${{ secrets.SUPABASE_DB_SSLMODE }}
          DB_CONN_MAX_AGE: ${{ secrets.DB_CONN_MAX_AGE }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_JWT_AUD: ${{ secrets.SUPABASE_JWT_AUD }}

          # ------------------------- CDN STORAGE -------------------------
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_STORAGE_BUCKET_NAME: ${{ secrets.AWS_STORAGE_BUCKET_NAME }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          CONTAINER_PREFIX: ${{ secrets.CONTAINER_PREFIX }}

          # ------------------------- AUTH -------------------------
          SHARED_M2M_JWT_SECRET_KEY: ${{ secrets.SHARED_M2M_JWT_SECRET_KEY }}
          M2M_JWT_AUDIENCE: ${{ secrets.M2M_JWT_AUDIENCE }}

          # ------------------------- TEXT PROCESSING DETAILS -------------------------
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          # -------------------------- REDIS CONFIG ----------------------------
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # ===========================================================
        run: |
          python manage.py test

  build-and-push-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/sanalysis:staging-${{ github.sha }},${{ secrets.DOCKER_HUB_USERNAME }}/sanalysis:latest

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v3
      - name: Setup SSH Key and Add to Known Hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP_STAGING }} >> ~/.ssh/known_hosts
      - name: Install GPG
        run: sudo apt-get update && sudo apt-get install -y gnupg
      - name: Decrypt .env.prod.gpg File
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: echo $GPG_PASSPHRASE | gpg --quiet --batch --yes --decrypt --passphrase-fd 0 --output ./.env.prod ./.env.prod.gpg
      - name: Transfer Repository to Remote Server (Including Decrypted .env.prod)
        run: rsync -avz -e "ssh -i ~/.ssh/id_rsa" ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP_STAGING }}:/home/ubuntu/sanalysis/
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/sanalysis:staging-${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_IP_STAGING }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOCKER_IMAGE
          script: |
            set -e
            cd /home/ubuntu/sanalysis

            # Ensure scripts are executable (in case they are not already)
            chmod +x install_docker.sh
            chmod +x entrypoint.sh

            # Check if Docker Compose is installed
            if ! command -v docker-compose &> /dev/null && ! docker compose version &> /dev/null; then
              echo "Installing Docker Compose..."
              ./install_docker.sh
              # No need to modify PATH or logout/login; Docker should be immediately usable
            else
              echo "Docker Compose already installed."
            fi

            # Login to Docker
            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

            # Pull image
            sudo docker pull $DOCKER_IMAGE

            sudo docker compose -f docker-compose-prod.yml down
            sudo docker compose -f docker-compose-prod.yml up -d

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Setup crontab for Docker cleanup
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP_STAGING }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # Define the cron job command with logging
            CRON_JOB="0 0 * * * /usr/bin/docker system prune -af > /var/log/docker_cleanup.log 2>&1"

            # Create a log file and set permissions (if not already exist)
            sudo touch /var/log/docker_cleanup.log
            sudo chmod 644 /var/log/docker_cleanup.log

            # Check if the cleanup cron job already exists for the current user
            (crontab -l 2>/dev/null | grep -q "docker system prune") || ( (crontab -l 2>/dev/null; echo "$CRON_JOB") | crontab - )

            # Ensure the cron service is running
            sudo service cron restart

            # This cron job is scheduled to run at midnight every day, performing a Docker system prune
            # to remove unused Docker objects and logs the output to /var/log/docker_cleanup.log.

